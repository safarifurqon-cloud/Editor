<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Editor Tampilator</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f3f5;
 color:#222
}

header{
 background:#155d35;
 color:white;
 padding:14px 16px;
 position:sticky;
 top:0;
 z-index:20
}

header h1{
 margin:0 0 8px;
 font-size:22px
}

.server{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 align-items:center
}

button{
 border:0;
 border-radius:5px;
 padding:9px 13px;
 font-weight:bold;
 cursor:pointer
}

button:disabled{
 opacity:.45;
 cursor:not-allowed
}

.get{
 background:#f6c344
}

.save{
 background:#43a047;
 color:white
}

.addpage{
 background:#1976d2;
 color:white;
 margin-top:5px
}

.status{
 font-size:13px;
 margin-top:7px
}

main{
 max-width:1100px;
 margin:16px auto;
 padding:0 10px
}

.page{
 background:white;
 border-radius:8px;
 margin-bottom:18px;
 padding:15px;
 box-shadow:0 1px 5px #bbb
}

.pagehead{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
 border-bottom:1px solid #ddd;
 padding-bottom:10px
}

.pagehead strong{
 font-size:18px
}

.pageActions{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 justify-content:flex-end
}

.pageActions button{
 color:white
}

.moveUp{
 background:#1565c0
}

.moveDown{
 background:#6a1b9a
}

.deletePage{
 background:#c62828
}

.field{
 margin-top:12px
}

label{
 display:block;
 font-weight:bold;
 margin-bottom:5px
}

input,textarea{
 width:100%;
 padding:9px;
 border:1px solid #aaa;
 border-radius:5px;
 font-size:16px
}

textarea{
 min-height:90px;
 resize:vertical
}

.grid{
 display:grid;
 grid-template-columns:1fr 150px;
 gap:12px
}

.tablewrap{
 overflow:auto;
 border:1px solid #bbb;
 margin-top:12px
}

table{
 border-collapse:collapse;
 width:100%;
 min-width:600px;
 table-layout:fixed
}

table.has-content{
 width:max-content;
 min-width:0;
 table-layout:auto
}

th,td{
 border:1px solid #bbb;
 padding:6px;
 vertical-align:middle
}

th{
 background:#e8f5e9
}

th input{
 font-weight:bold;
 background:white
}

td input{
 min-width:80px
}

table:not(.has-content) th input,
table:not(.has-content) td input{
 width:100%
}

table.has-content th input,
table.has-content td input{
 width:auto;
 min-width:60px;
 max-width:500px
}

.action{
 text-align:center;
 width:48px
}

.deleteRow{
 background:#e53935;
 color:white;
 padding:5px 9px;
 border-radius:4px;
 font-size:16px
}

.controls{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:10px
}

.addrow{
 background:#2e7d32;
 color:white
}

.notice{
 background:#fff8e1;
 border-left:4px solid #f9a825;
 padding:10px;
 margin-bottom:15px
}

.empty{
 padding:20px;
 text-align:center;
 color:#777
}

.chooser{
 background:white;
 border-radius:8px;
 margin-bottom:18px;
 padding:20px;
 box-shadow:0 1px 5px #bbb;
 text-align:center
}

.chooserTitle{
 font-size:18px;
 font-weight:bold;
 margin-bottom:15px
}

.chooser button{
 margin:4px;
 min-width:150px
}

.btnText{
 background:#1976d2;
 color:white
}

.btnTable{
 background:#388e3c;
 color:white
}

.btnFinance{
 background:#ef6c00;
 color:white
}

.btnCancel{
 background:#777;
 color:white
}

/* FINANCE */

.finance table{
 min-width:650px
}

.finance th{
 background:#fff3e0
}

.finance th:nth-child(1),
.finance td:nth-child(1){
 min-width:120px
}

.finance th:nth-child(2),
.finance td:nth-child(2){
 min-width:220px
}

.finance th:nth-child(3),
.finance td:nth-child(3),
.finance th:nth-child(4),
.finance td:nth-child(4){
 min-width:140px
}

@media(max-width:650px){

 .grid{
  grid-template-columns:1fr
 }

 .chooser button{
  width:100%;
  margin:5px 0
 }

 .pagehead{
  align-items:flex-start;
  flex-direction:column
 }

 .pageActions{
  width:100%
 }

 .pageActions button{
  flex:1
 }

}
</style>

</head>

<body>

<header>

<h1>Editor Tampilator</h1>

<div class="server">

<button class="get" onclick="findTVBox()">
Cari Tampilator
</button>

<button class="get" onclick="getData()">
Ambil Data
</button>

<button class="save" onclick="saveData()">
Simpan Data
</button>

</div>

<div id="status" class="status">
Siap.
</div>

</header>

<main>

<div class="notice">
<b>Catatan durasi:</b>
durasi adalah waktu diam untuk satu layar awal.
Jika tabel lebih panjang dari layar, Tampilator akan diam sesuai durasi,
kemudian scroll perlahan sampai bawah dan diam 5 detik pada bagian terakhir.
</div>

<div id="pages"></div>

<button class="addpage" onclick="addPage()">
＋ Tambah Halaman
</button>

</main>

<script>

/* =====================================================
   DATA
   ===================================================== */

let data={
 pages:[]
};


/* =====================================================
   KONSTANTA
   ===================================================== */

const MAX_NORMAL_TABLE_COLUMNS=4;
const FINANCE_COLUMNS=4;


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function esc(v){

 return String(v??'')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;');

}


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(text,ok=true){

 const e=document.getElementById('status');

 e.textContent=text;

 e.style.color=
  ok
  ? '#d7ffd9'
  : '#ffd0d0';

}


/* =====================================================
   NORMALISASI DATA
   ===================================================== */

function normalize(){

 if(!data || !Array.isArray(data.pages)){

  data={
   pages:[]
  };

 }

 data.pages.forEach((p,i)=>{

  if(!p || typeof p!=='object'){

   data.pages[i]={
    type:'table',
    judul:'Halaman '+(i+1),
    durasi:10,
    columns:[
     'Kolom 1',
     'Kolom 2',
     'Kolom 3'
    ],
    rows:[
     ['','','']
    ]
   };

   return;

  }

  p.judul=
   p.judul ||
   p.title ||
   ('Halaman '+(i+1));

  p.type=
   p.type ||
   'table';

  if(
   p.type!=='text' &&
   p.type!=='table' &&
   p.type!=='finance'
  ){

   p.type='table';

  }

  p.durasi=
   Math.max(
    1,
    Number(
     p.durasi ??
     p.duration
    )||10
   );

  if(p.type==='text'){

   p.isi=
    p.isi ||
    '';

   return;

  }

  if(!Array.isArray(p.columns)){

   if(Array.isArray(p.headers)){

    p.columns=
     p.headers.slice();

   }else{

    p.columns=[
     'Kolom 1',
     'Kolom 2',
     'Kolom 3'
    ];

   }

  }

  const maxCols=
   p.type==='finance'
   ? FINANCE_COLUMNS
   : MAX_NORMAL_TABLE_COLUMNS;

  if(p.columns.length>maxCols){

   p.columns=
    p.columns.slice(0,maxCols);

  }

  if(!p.columns.length){

   p.columns=
    p.type==='finance'
    ? [
       'Kolom 1',
       'Kolom 2',
       'Kolom 3',
       'Kolom 4'
      ]
    : [
       'Kolom 1'
      ];

  }

  if(!Array.isArray(p.rows)){

   p.rows=[];

  }

  p.rows=p.rows.map(row=>{

   if(!Array.isArray(row)){

    row=[];

   }

   while(
    row.length<
    p.columns.length
   ){

    row.push('');

   }

   return row.slice(
    0,
    p.columns.length
   );

  });

 });

}


/* =====================================================
   CEK ISI TABEL
   ===================================================== */

function tableHasContent(pi){

 const p=
  data.pages[pi];

 if(
  !p ||
  p.type==='text'
 ){
  return false;
 }

 for(const h of p.columns){

  if(
   String(h??'').trim()!=='' &&
   !/^Kolom \d+$/.test(
    String(h).trim()
   )
  ){

   return true;

  }

 }

 for(const row of p.rows){

  for(const value of row){

   if(
    String(value??'').trim()!==''
   ){

    return true;

   }

  }

 }

 return false;

}


/* =====================================================
   UPDATE LEBAR TABEL
   ===================================================== */

function updateTableSizing(pi){

 const table=
  document.querySelector(
   `table[data-page="${pi}"]`
  );

 if(!table){
  return;
 }

 if(tableHasContent(pi)){

  table.classList.add(
   'has-content'
  );

 }else{

  table.classList.remove(
   'has-content'
  );

 }

}


/* =====================================================
   PINDAH HALAMAN
   ===================================================== */

function movePageUp(i){

 if(i<=0){
  return;
 }

 const temp=
  data.pages[i-1];

 data.pages[i-1]=
  data.pages[i];

 data.pages[i]=
  temp;

 render();

}


function movePageDown(i){

 if(i>=data.pages.length-1){
  return;
 }

 const temp=
  data.pages[i+1];

 data.pages[i+1]=
  data.pages[i];

 data.pages[i]=
  temp;

 render();

}


/* =====================================================
   RENDER
   ===================================================== */

function render(){

 normalize();

 const root=
  document.getElementById('pages');

 if(!data.pages.length){

  root.innerHTML=
   '<div class="empty">'+
   'Belum ada halaman. Tekan Tambah Halaman.'+
   '</div>';

  return;

 }

 root.innerHTML=
  data.pages.map((p,pi)=>{

   /* =================================================
      TEXT
      ================================================= */

   if(p.type==='text'){

    return `

    <section class="page">

     <div class="pagehead">

      <strong>
       Halaman ${pi+1}
      </strong>

      <div class="pageActions">

       <button
        class="moveUp"
        onclick="movePageUp(${pi})"
        ${pi===0?'disabled':''}>
        ↑ Naik
       </button>

       <button
        class="moveDown"
        onclick="movePageDown(${pi})"
        ${pi===data.pages.length-1?'disabled':''}>
        ↓ Turun
       </button>

       <button
        class="deletePage"
        onclick="deletePage(${pi})">
        Hapus Halaman
       </button>

      </div>

     </div>

     <div class="field">

      <label>Judul</label>

      <input
       value="${esc(p.judul)}"
       oninput="
        data.pages[${pi}].judul=this.value
       ">

     </div>

     <div class="field">

      <label>Isi Pengumuman</label>

      <textarea
       oninput="
        data.pages[${pi}].isi=this.value
       ">${esc(p.isi)}</textarea>

```
 </div>

 <div class="field">

  <label>Durasi (detik)</label>

  <input
   type="number"
   min="1"
   value="${p.durasi}"
   oninput="
    data.pages[${pi}].durasi=
    Math.max(
     1,
     Number(this.value)||1
    )
   ">

 </div>

</section>

`;
```

}

/* =================================================
TABEL / FINANCE
================================================= */

const isFinance=
p.type==='finance';

return `

   <section class="page ${isFinance?'finance':''}">

```
<div class="pagehead">

 <strong>
  Halaman ${pi+1}
 </strong>

 <div class="pageActions">

  <button
   class="moveUp"
   onclick="movePageUp(${pi})"
   ${pi===0?'disabled':''}>
   ↑ Naik
  </button>

  <button
   class="moveDown"
   onclick="movePageDown(${pi})"
   ${pi===data.pages.length-1?'disabled':''}>
   ↓ Turun
  </button>

  <button
   class="deletePage"
   onclick="deletePage(${pi})">
   Hapus Halaman
  </button>

 </div>

</div>


<div class="field">

 <label>
  ${isFinance?'Judul Keuangan':'Judul Tabel'}
 </label>

 <input
  value="${esc(p.judul)}"
  oninput="
   data.pages[${pi}].judul=this.value
  ">

</div>


<div class="grid">

 <div class="field">

  <label>
   Jumlah Kolom
  </label>

  <input
   type="number"
   min="${isFinance?4:1}"
   max="${isFinance?4:4}"
   value="${p.columns.length}"
   ${isFinance?'disabled':''}
   onchange="
    setCols(${pi},this.value)
   ">

 </div>


 <div class="field">

  <label>
   Durasi (detik)
  </label>

  <input
   type="number"
   min="1"
   value="${p.durasi}"
   oninput="
    data.pages[${pi}].durasi=
    Math.max(
     1,
     Number(this.value)||1
    )
   ">

 </div>

</div>


<div class="tablewrap">

 <table
  data-page="${pi}"
  class="${
   tableHasContent(pi)
   ? 'has-content'
   : ''
  }">

  <thead>

   <tr>

    ${
     p.columns.map((h,ci)=>`

     <th>

      <input
       value="${esc(h)}"
       oninput="
        data.pages[${pi}].columns[${ci}]=this.value;
        updateTableSizing(${pi})
       ">

     </th>

     `).join('')
    }

    <th class="action">
     X
    </th>

   </tr>

  </thead>


  <tbody>

   ${
    p.rows.map((r,ri)=>`

    <tr>

     ${
      r.map((v,ci)=>`

      <td>

       <input
        value="${esc(v)}"
        oninput="
         data.pages[${pi}].rows[${ri}][${ci}]=this.value;
         updateTableSizing(${pi})
        ">

      </td>

      `).join('')
     }

     <td class="action">

      <button
       class="deleteRow"
       title="Hapus baris"
       onclick="
        deleteRow(${pi},${ri})
       ">
       X
      </button>

     </td>

    </tr>

    `).join('')
   }

  </tbody>

 </table>

</div>


<div class="controls">

 <button
  class="addrow"
  onclick="addRow(${pi})">
  ＋ Tambah Baris
 </button>

</div>
```

   </section>

`;

}).join('');

}

/* =====================================================
TAMBAH HALAMAN
===================================================== */

function addPage(){

const root=
document.getElementById('pages');

root.innerHTML=`

  <div class="chooser">

   <div class="chooserTitle">
    Pilih Jenis Halaman
   </div>

<button
 class="btnText"
 onclick="buatHalamanText()">
HALAMAN TEXT </button>

<button
 class="btnTable"
 onclick="buatHalamanTabel()">
TABEL </button>

<button
 class="btnFinance"
 onclick="buatHalamanFinance()">
KEUANGAN </button>

<button
 class="btnCancel"
 onclick="render()">
BATAL </button>

  </div>

`;

}

/* =====================================================
BUAT TEXT
===================================================== */

function buatHalamanText(){

const number=
data.pages.length+1;

data.pages.push({

type:'text',

judul:
'Halaman '+number,

isi:'',

durasi:10

});

render();

}

/* =====================================================
BUAT TABEL
===================================================== */

function buatHalamanTabel(){

const number=
data.pages.length+1;

data.pages.push({

type:'table',

judul:
'Halaman '+number,

durasi:10,

columns:[
'Kolom 1',
'Kolom 2',
'Kolom 3'
],

rows:[
['','','']
]

});

render();

}

/* =====================================================
BUAT FINANCE
===================================================== */

function buatHalamanFinance(){

const number=
data.pages.length+1;

data.pages.push({

type:'finance',

judul:
'Halaman '+number,

durasi:10,

columns:[
'Kolom 1',
'Kolom 2',
'Kolom 3',
'Kolom 4'
],

rows:[
['','','','']
]

});

render();

}

/* =====================================================
HAPUS HALAMAN
===================================================== */

function deletePage(i){

if(
confirm('Hapus halaman ini?')
){

data.pages.splice(i,1);

render();

}

}

/* =====================================================
TAMBAH BARIS
===================================================== */

function addRow(pi){

const p=
data.pages[pi];

p.rows.push(
new Array(
p.columns.length
).fill('')
);

render();

}

/* =====================================================
HAPUS BARIS
===================================================== */

function deleteRow(pi,ri){

data.pages[pi].rows.splice(
ri,
1
);

render();

}

/* =====================================================
UBAH JUMLAH KOLOM
===================================================== */

function setCols(pi,val){

const p=
data.pages[pi];

const max=
p.type==='finance'
? FINANCE_COLUMNS
: MAX_NORMAL_TABLE_COLUMNS;

let n=
Math.max(
1,
Math.min(
max,
parseInt(val)||1
)
);

p.columns=
p.columns.slice(0,n);

while(
p.columns.length<n
){

p.columns.push(
'Kolom '+
(p.columns.length+1)
);

}

p.rows.forEach(row=>{

row.length=n;

while(
row.length<n
){

row.push('');

}

});

render();

}

/* =====================================================
PENCARIAN TAMPILATOR OTOMATIS
===================================================== */

let tvBoxUrl='';

function url(){

return tvBoxUrl;

}

async function probe(host){

try{

const r=
await fetch(
'http://'+
host+
':8080/Get_Data?t='+
Date.now(),
{
method:'GET',
cache:'no-store'
}
);

if(!r.ok){
return false;
}

const x=
await r.json();

return !!(
x &&
x.data &&
Array.isArray(
x.data.pages
)
);

}catch(e){

return false;

}

}

async function findTVBox(){

setStatus(
'Mencari Tampilator...',
true
);

tvBoxUrl='';

const hosts=[];

for(
let i=1;
i<=254;
i++
){

hosts.push(
'192.168.43.'+i
);

}

let found=false;

const batch=20;

for(
let i=0;
i<hosts.length && !found;
i+=batch
){

const group=
hosts.slice(
i,
i+batch
);

const results=
await Promise.all(
group.map(
async h=>({
h,
ok:await probe(h)
})
)
);

const hit=
results.find(
x=>x.ok
);

if(hit){

tvBoxUrl=
'http://'+
hit.h+
':8080';

found=true;

}

}

if(found){

setStatus(
'Tampilator ditemukan: '+
tvBoxUrl,
true
);

return true;

}

setStatus(
'Tampilator tidak ditemukan. Pastikan HP terhubung ke hotspot TV Box.',
false
);

return false;

}

/* =====================================================
AMBIL DATA
===================================================== */

async function getData(){

if(!tvBoxUrl){

const found=
await findTVBox();

if(!found){
return;
}

}

setStatus(
'Mengambil data dari TV Box...',
true
);

try{

const r=
await fetch(
url()+
'/Get_Data?t='+
Date.now(),
{
method:'GET',
cache:'no-store'
}
);

if(!r.ok){

throw Error(
'HTTP '+r.status
);

}

const x=
await r.json();

if(
!x ||
!x.data ||
!Array.isArray(
x.data.pages
)
){

throw Error(
'Format data dari server tidak sesuai.'
);

}

data=
x.data;

normalize();

render();

setStatus(
'Data berhasil diambil dari TV Box.',
true
);

}catch(e){

console.error(e);

setStatus(
'Ambil Data gagal: '+
e.message,
false
);

}

}

/* =====================================================
SIMPAN DATA
===================================================== */

async function saveData(){

normalize();

if(!tvBoxUrl){

const found=
await findTVBox();

if(!found){
return;
}

}

setStatus(
'Menyimpan data ke TV Box...',
true
);

try{

const r=
await fetch(
url()+'/Set_Data',
{
method:'POST',

```
 headers:{
  'Content-Type':
   'application/json'
 },

 body:
  JSON.stringify(data)
}
```

);

if(!r.ok){

throw Error(
'HTTP '+r.status
);

}

const x=
await r.json();

if(
x &&
x.status &&
x.status!=='OK'
){

throw Error(
x.message||
'Server menolak data.'
);

}

setStatus(
'Data berhasil disimpan ke TV Box.',
true
);

}catch(e){

console.error(e);

setStatus(
'Simpan Data gagal: '+
e.message,
false
);

}

}

/* =====================================================
MULAI
===================================================== */

render();

findTVBox();

</script>

</body>
</html>
